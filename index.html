<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>HireMatch.AI — Sign In</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap');
:root {
  --bg:#08080f; --surface:#111119; --surface2:#1c1c28; --border:#252535;
  --accent:#7c6fff; --accent2:#a78bfa; --text:#eeeeff; --muted:#7070a0;
  --green:#10b981; --red:#f87171;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;}

/* background grid */
body::before{
  content:'';position:fixed;inset:0;
  background-image:linear-gradient(rgba(124,111,255,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(124,111,255,0.04) 1px,transparent 1px);
  background-size:48px 48px;pointer-events:none;z-index:0;
}

.wrap{position:relative;z-index:1;width:100%;max-width:420px;}

.logo{font-family:'Space Grotesk',sans-serif;font-size:1.5rem;font-weight:700;text-align:center;margin-bottom:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.tagline{text-align:center;color:var(--muted);font-size:0.875rem;margin-bottom:36px;}

.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:32px;}
.tabs{display:flex;gap:4px;background:var(--surface2);border-radius:10px;padding:4px;margin-bottom:28px;}
.tab{flex:1;padding:9px;text-align:center;font-size:0.875rem;font-weight:500;border-radius:7px;cursor:pointer;border:none;background:transparent;color:var(--muted);transition:all 0.2s;font-family:'Inter',sans-serif;}
.tab.active{background:var(--surface);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,0.4);}

.form-group{margin-bottom:18px;}
label{display:block;font-size:0.8rem;font-weight:500;color:var(--muted);margin-bottom:7px;letter-spacing:0.03em;}
input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:9px;color:var(--text);font-family:'Inter',sans-serif;font-size:0.9rem;padding:12px 14px;outline:none;transition:border-color 0.2s;}
input:focus{border-color:var(--accent);}
input::placeholder{color:var(--muted);}

.btn{width:100%;padding:13px;border-radius:9px;font-family:'Space Grotesk',sans-serif;font-size:0.95rem;font-weight:600;cursor:pointer;border:none;transition:all 0.2s;margin-top:4px;}
.btn-primary{background:linear-gradient(135deg,var(--accent),#8b5cf6);color:#fff;box-shadow:0 4px 20px rgba(124,111,255,0.3);}
.btn-primary:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 28px rgba(124,111,255,0.4);}
.btn-primary:disabled{opacity:0.5;cursor:not-allowed;transform:none;}

.msg{font-size:0.85rem;padding:11px 14px;border-radius:8px;margin-top:14px;display:none;}
.msg-error{background:rgba(248,113,113,0.1);border:1px solid rgba(248,113,113,0.3);color:var(--red);}
.msg-success{background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.3);color:var(--green);}

.divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--muted);font-size:0.8rem;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border);}

.config-note{background:rgba(124,111,255,0.08);border:1px solid rgba(124,111,255,0.2);border-radius:10px;padding:14px;margin-bottom:24px;font-size:0.82rem;color:var(--muted);line-height:1.6;}
.config-note strong{color:var(--accent2);}
.config-note code{background:rgba(255,255,255,0.07);padding:1px 6px;border-radius:4px;font-size:0.8rem;color:var(--text);}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">HireMatch.AI</div>
  <p class="tagline">Know exactly why you're not getting interviews</p>

  <div class="config-note">
    <strong>Setup required:</strong> Replace <code>YOUR_SUPABASE_URL</code> and <code>YOUR_SUPABASE_ANON_KEY</code> in the <code>&lt;script&gt;</code> at the bottom of this file with your Supabase project credentials.
  </div>

  <div class="card">
    <div class="tabs">
      <button class="tab active" onclick="switchTab('signin')">Sign in</button>
      <button class="tab" onclick="switchTab('signup')">Create account</button>
    </div>

    <!-- SIGN IN -->
    <div id="signinForm">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="siEmail" placeholder="you@email.com"/>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="siPassword" placeholder="••••••••"/>
      </div>
      <button class="btn btn-primary" id="siBtn" onclick="signIn()">Sign in</button>
      <div class="msg msg-error" id="siError"></div>
    </div>

    <!-- SIGN UP -->
    <div id="signupForm" style="display:none;">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="suEmail" placeholder="you@email.com"/>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="suPassword" placeholder="Min 6 characters"/>
      </div>
      <button class="btn btn-primary" id="suBtn" onclick="signUp()">Create account</button>
      <div class="msg msg-error" id="suError"></div>
      <div class="msg msg-success" id="suSuccess"></div>
    </div>
  </div>
</div>

<script>
// ⚠️ REPLACE THESE WITH YOUR SUPABASE PROJECT CREDENTIALS
const SUPABASE_URL = 'YOUR_SUPABASE_URL';
const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';

const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Redirect if already logged in
sb.auth.getSession().then(({ data }) => {
  if (data.session) window.location.href = 'app.html';
});

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', ['signin','signup'][i] === tab));
  document.getElementById('signinForm').style.display = tab === 'signin' ? 'block' : 'none';
  document.getElementById('signupForm').style.display = tab === 'signup' ? 'block' : 'none';
}

async function signIn() {
  const email = document.getElementById('siEmail').value.trim();
  const password = document.getElementById('siPassword').value;
  const btn = document.getElementById('siBtn');
  const err = document.getElementById('siError');
  err.style.display = 'none';
  btn.disabled = true; btn.textContent = 'Signing in...';
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) { err.textContent = error.message; err.style.display = 'block'; btn.disabled = false; btn.textContent = 'Sign in'; }
  else window.location.href = 'app.html';
}

async function signUp() {
  const email = document.getElementById('suEmail').value.trim();
  const password = document.getElementById('suPassword').value;
  const btn = document.getElementById('suBtn');
  const err = document.getElementById('suError');
  const suc = document.getElementById('suSuccess');
  err.style.display = 'none'; suc.style.display = 'none';
  btn.disabled = true; btn.textContent = 'Creating account...';
  const { error } = await sb.auth.signUp({ email, password });
  if (error) { err.textContent = error.message; err.style.display = 'block'; }
  else { suc.textContent = 'Account created! Check your email to confirm, then sign in.'; suc.style.display = 'block'; }
  btn.disabled = false; btn.textContent = 'Create account';
}
</script>
</body>
</html>
